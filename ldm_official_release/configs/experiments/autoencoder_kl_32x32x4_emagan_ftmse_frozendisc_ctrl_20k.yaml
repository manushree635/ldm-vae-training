# FROZEN-DISCRIMINATOR CONTROL: steerable term OFF (w=0), critic held static.
#
# Sibling of ..._w2eq_frozendisc_20k.yaml (job 7414742) -- identical except
# steerable_weight: 2.0 -> 0.0. That run confounded two things: freezing the
# critic AND adding the steerable term. This isolates the freeze alone by
# comparing against mctrl (normal, TRAINED discriminator, steerable_weight 0.0,
# rFID 9.129 -- the best result in the whole study).
#
# w2eq_frozendisc's own trajectory: rFID peaks at 9.508 @ep1, then degrades
# monotonically to 13.46 by ep25 -- worse than mctrl throughout. This run asks
# whether that degradation is caused by the frozen critic itself (expect this
# arm to ALSO degrade past ep1, tracking w2eq_frozendisc's shape) or by the
# steerable term interacting badly with a static critic (expect this arm to
# instead track mctrl's monotonic IMPROVEMENT, since nothing here should differ
# from mctrl except the critic never updating).
#
# Everything else matches mctrl exactly: sd-vae-ft-mse init, disc_start 200,
# disc_weight 0.5, same data. Frozen is NOT the same as off -- disc_factor
# still gates BOTH branches of upstream's loss, so the decoder still sees
# g_loss from the discriminator; only the discriminator's own weights never
# update (opt_disc lr=0, BatchNorm stats pinned in eval() -- see
# ldm_ftmse/autoencoder_frozendisc.py for why lr=0 rather than a plain
# requires_grad_(False) + skipped backward: the latter breaks DDP's reducer
# accounting at 2+ ranks).

model:
  base_learning_rate: 4.5e-6            # upstream LDM's value; the model cards publish none
  target: ldm_ftmse.autoencoder_frozendisc.AutoencoderKLSteerableEMAFrozenDisc
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_steerable.LPIPSWithDiscriminatorSteerable
      params:
        disc_start: 200                 # ~1 epoch; safe only because the
        kl_weight: 0.000001             # discriminator is pretrained (kl-f8, step 246803)
        disc_weight: 0.5
        # --- steerable distillation, the only new term ---------------------------
        # steerable_normalize: nll_units multiplies the mean-reduced rel-L1 by
        # 3*256*256 = 196608, putting it in the same per-image-sum units as nll_loss.
        # Without it, weight 0.5 against a total of ~29,000 is ~1e-6 of the objective
        # and the run would be indistinguishable from the control.
        steerable_weight: 0.0   # CONTROL: term disabled -- isolates the frozen critic alone
        steerable_normalize: nll_units
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        steerable_band_weights:         # graded diffweight ramp, level 0 = FINEST
          "('residual_highpass',)": 1.0
          "('band', 0, 0)": 1.0
          "('band', 0, 1)": 1.0
          "('band', 0, 2)": 1.0
          "('band', 0, 3)": 1.0
          "('band', 1, 0)": 1.0
          "('band', 1, 1)": 1.0
          "('band', 1, 2)": 1.0
          "('band', 1, 3)": 1.0
          "('band', 2, 0)": 1.0
          "('band', 2, 1)": 1.0
          "('band', 2, 2)": 1.0
          "('band', 2, 3)": 1.0
          "('band', 3, 0)": 1.0
          "('band', 3, 1)": 1.0
          "('band', 3, 2)": 1.0
          "('band', 3, 3)": 1.0
          "('band', 4, 0)": 1.0
          "('band', 4, 1)": 1.0
          "('band', 4, 2)": 1.0
          "('band', 4, 3)": 1.0
          "('residual_lowpass',)": 1.0

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12
    num_workers: 6                      # +2 over baseline: an extra 512 PNG decode per item
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    accumulate_grad_batches: 2
    max_epochs: 25
