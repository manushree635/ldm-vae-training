# emagan recipe on the RCROP dataset with augmentation DISABLED.
#
# This is the augmentation control the SD-1.5 comparison never had. The original
# emagan run (job 7367616, rFID 9.569) trained on subset_20k with upstream's
# random-resized-crop live: crop_side_len = min_side * U(0.5, 1.0) at a random
# position, redrawn every __getitem__, so it saw ~475,000 distinct crops over 25
# epochs. The steerable arms train on subset_20k_rcrop through data_teacher,
# which forces min_crop_f = max_crop_f = 1.0 and random_crop = False because a
# precomputed full-frame teacher only aligns with a full-frame student crop --
# so they see 19,000 images repeated 25 times, unchanged.
#
# The steerable arms therefore trailed emagan by ~0.28 rFID while differing in
# TWO things: the term, and the loss of augmentation. Crop changes alone moved
# rFID 0.25 in this project's earlier knob sweep, so the two effects are the same
# size and nothing has separated them on the SD-1.5 side.
#
# This run changes ONLY the data: same SD-1.5 init, same EMA, same pretrained
# kl-f8 discriminator at disc_start 200, upstream's LPIPSWithDiscriminator
# untouched, no steerable term anywhere. It uses ldm_ftmse.data.FileListSRTrain
# (not data_teacher) because the teacher is not needed -- the crop parameters are
# passed straight through to ImageNetSR, so no teacher PNGs are loaded and no
# alignment constraint applies.
#
#   emagan (augmented, subset_20k)     9.569   <- on record
#   THIS  (fixed crops, subset_20k_rcrop)  ?   <- the difference is augmentation alone
#   steerable w=0.5 (fixed crops)      9.849   <- on record
#
# If this lands near 9.849, the steerable term costs nothing and the whole gap
# was augmentation. If it lands near 9.569, the term genuinely costs ~0.28.

model:
  base_learning_rate: 4.5e-6            # upstream LDM's value. NOTE: the model
                                      # cards do NOT publish a learning rate.
  target: ldm_ftmse.autoencoder.AutoencoderKLDecoderOnlyEMA
  params:
    monitor: "val/rec_loss"
    embed_dim: 4
    use_ema: True
    ckpt_path: "${oc.env:LDM_ROOT}/models/sd15_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator   # upstream, unmodified
      params:                           # upstream values; perceptual_weight
        disc_start: 200        # ~1 epoch; safe only because the
                               # discriminator is pretrained (kl-f8, step 246803)
        kl_weight: 0.000001
        disc_weight: 0.5

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]  # num_down = len(ch_mult)-1
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12                      # upstream
    num_workers: 4                      # upstream leaves this unset, which
    wrap: True                          # defaults to batch_size*2 = 24 per rank
    train:                              # (96 workers on 16 cores). Operational.
      target: ldm_ftmse.data.FileListSRTrain
      params:
        size: 256                       # upstream
        degradation: pil_nearest        # upstream
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        min_crop_f: 1.0                  # augmentation OFF -- identical to
        max_crop_f: 1.0                  # what data_teacher forces
        random_crop: False
    validation:
      target: ldm_ftmse.data.FileListSRValidation
      params:
        size: 256                       # upstream
        degradation: pil_nearest        # upstream
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        min_crop_f: 1.0                  # augmentation OFF -- identical to
        max_crop_f: 1.0                  # what data_teacher forces
        random_crop: False

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    accumulate_grad_batches: 2          # upstream
    max_epochs: 25                      # the plain run showed everything happens
                                        # early; 25 is ample to see the effect
