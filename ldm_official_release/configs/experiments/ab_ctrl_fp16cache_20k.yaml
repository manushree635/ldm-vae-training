# A/B ARM: fp16cache -- latent_cache + disc_skip_recon_loss + fp16.
#
# The chosen production stack: every speedup that is BIT-EXACT or a pure
# PRECISION change, and nothing that alters the algorithm.
#
# Measured per-step, batch 12 (logs/ldm_iso2.o7444737, baseline 1632.3 ms):
#
#   fp16 only                        1293.4 ms   1.262x
#   latent_cache only                1359.4 ms   1.201x
#   latent_cache + skip (bit-exact)  1308.6 ms   1.247x
#   THIS ARM: + fp16                 1019.1 ms   1.602x
#   (+ disc_reuse_recon)              794.9 ms   2.053x   <- algorithm change, declined
#
# Compute-only figures overstate: dataloading and DDP are not accelerated. Two
# real 2-GPU runs calibrate ~10-15% fixed per-epoch overhead, so expect ~1.5x.
#
# NOT numerically comparable to the fp32 arms -- fp16 is a precision change by
# definition. Intended for fresh runs (the 1M run), never for an in-flight arm.
# The bit-exact tier alone (latent_cache + skip, 1.247x) is the option that keeps
# comparability, and it is safe on in-flight arms: baseline-vs-baseline drift is
# ~26x larger than the delta it introduces (job 7441454).

model:
  base_learning_rate: 4.5e-6            # upstream LDM's value; the model cards publish none
  target: ldm_ftmse.autoencoder_steerable.AutoencoderKLSteerableEMA
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    # --- speed flags. Everything here is either BIT-EXACT or a pure PRECISION
    # --- change. No flag alters the algorithm.
    #
    # disc_reuse_recon: OFF, deliberately. It is the single largest remaining
    # lever (1.265x, and 1.602x -> 2.053x on the whole stack), but it is an
    # ALGORITHM change, not an optimisation: Lightning steps opt_ae between the
    # two closures, so the discriminator would train against a PRE-update
    # reconstruction on accumulation boundaries, and one posterior.sample() drops
    # out of the RNG stream. Standard in many GAN codebases, but it is a modelling
    # decision that would have to be defended -- so it stays off.
    #
    # channels_last: OFF. MEASURED 0.639x on A100 / 0.730x on A40 -- i.e. 27-56%
    # SLOWER. torch 1.11 has no channels_last GroupNorm kernel and falls back via
    # .contiguous(); this decoder has two GroupNorms per ResnetBlock, so it would
    # transpose at every block instead of never. Revisit only after a torch 2.x port.
    #
    # allow_tf32: OFF. Under fp16 autocast the attention bmms already run in fp16,
    # so it is a no-op here (it was worth 1.008x in fp32). No reason to carry a
    # numerics change that buys nothing.
    disc_reuse_recon: False
    allow_tf32: False
    channels_last: False
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_steerable.LPIPSWithDiscriminatorSteerable
      params:
        disc_skip_recon_loss: True      # BIT-EXACT: the disc branch's rec_loss,
                                        # LPIPS and kl are discarded upstream
        disc_start: 200                 # ~1 epoch; safe only because the
        kl_weight: 0.000001             # discriminator is pretrained (kl-f8, step 246803)
        disc_weight: 0.5
        # --- steerable distillation, the only new term ---------------------------
        # steerable_normalize: nll_units multiplies the mean-reduced rel-L1 by
        # 3*256*256 = 196608, putting it in the same per-image-sum units as nll_loss.
        # Without it, weight 0.5 against a total of ~29,000 is ~1e-6 of the objective
        # and the run would be indistinguishable from the control.
        steerable_weight: 0.0   # CONTROL: term disabled -- L1 + LPIPS + discriminator only
        steerable_normalize: nll_units
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        steerable_band_weights:         # graded diffweight ramp, level 0 = FINEST
          "('residual_highpass',)": 0.10
          "('band', 0, 0)": 0.12
          "('band', 0, 1)": 0.12
          "('band', 0, 2)": 0.12
          "('band', 0, 3)": 0.12
          "('band', 1, 0)": 0.18
          "('band', 1, 1)": 0.18
          "('band', 1, 2)": 0.18
          "('band', 1, 3)": 0.18
          "('band', 2, 0)": 0.27
          "('band', 2, 1)": 0.27
          "('band', 2, 2)": 0.27
          "('band', 2, 3)": 0.27
          "('band', 3, 0)": 0.60
          "('band', 3, 1)": 0.60
          "('band', 3, 2)": 0.60
          "('band', 3, 3)": 0.60
          "('band', 4, 0)": 1.50
          "('band', 4, 1)": 1.50
          "('band', 4, 2)": 1.50
          "('band', 4, 3)": 1.50
          "('residual_lowpass',)": 0.05

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12
    num_workers: 6                      # +2 over baseline: an extra 512 PNG decode per item
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
        latents_file: ${oc.env:LDM_DATA}/latent_cache/subset_20k_rcrop_ftmse_train.npy
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
        latents_file: ${oc.env:LDM_DATA}/latent_cache/subset_20k_rcrop_ftmse_val.npy

lightning:
  logger:
    target: pytorch_lightning.loggers.WandbLogger
    params:
      # NB main.py merges this over its TESTTUBE default, whose `name` is the
      # literal string "testtube" -- so `name` must be set here or the wandb run
      # is called that.
      name: ab_ctrl_fp16cache
      project: vae-knowledge-distillation
      group: ab_fp16cache_20k
      tags: ["ldm", "ab", "fp16cache", "no-algo-change"]
  callbacks:
    cuda_callback:                        # replaces main.py's default of the
      target: ldm_ftmse.wandb_logging.CUDACallbackLogged   # same key, so epoch
                                          # time and peak memory become metrics
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    precision: 16                       # fp16 AMP. The single biggest lever:
                                        # 464.8 -> 349.7 ms/step (1.33x).
                                        # PL 1.4.2 predates bf16, so fp16 +
                                        # GradScaler is the only AMP path here.
    accumulate_grad_batches: 2
    max_epochs: 5
