# 20k: MSE (weight 1) + VGG LPIPS 0.1 + the w1graded steerable config UNCHANGED (weight 1.0, graded
# diffweight ramp 0.12 -> 1.50 toward coarse, magnitude, upsample, height 5). The w1 twin of
# ..._w2graded_mse_lpips01_20k.yaml; differs from ..._w1graded_mse_20k.yaml ONLY by perceptual_weight
# (1.0 -> 0.1). 2 x H200, bf16, batch 48 x accum 1 = global 96, latent cache + disc skip.
# NOTE the header below is inherited from the MSE config; read this block first.
#
# sd-vae-ft-mse + steerable w=1.0, GRADED bands, static -- MSE recon loss (not L1).
#
# Loss-only diff from ..._ftmse_w1graded_20k.yaml: the reconstruction term becomes
# (x-y)^2 instead of |x-y|. Two config lines:
#     target: ldm_ftmse.losses_steerable_mse.LPIPSWithDiscriminatorSteerableMSE
#     rec_loss_type: mse
#
# The class is 3 lines -- it composes two things that already existed rather than
# reimplementing either. MRO is SteerableMSE -> Steerable -> MSE ->
# LPIPSWithDiscriminator: Steerable.forward runs, its super().forward() lands on
# the MSE variant which supplies the squared-error rec_loss, and the steerable
# term is added on top. Verified: at rec_loss_type="l1" the combined class is
# BIT-IDENTICAL to the plain steerable loss (loss diff 0.000e+00), and switching
# to "mse" changes nll while leaving rel_L1 untouched.
#
# WHY THIS IS NOT PURELY A NORM CHANGE. Upstream sums rec_loss per image over
# 3*256*256 elements, and the steerable term is normalised SEPARATELY by
# nll_units. |x-y| and (x-y)^2 are on different scales, so swapping the norm
# shifts the nll:steerable balance -- the same steerable_weight buys a different
# share. Compare train/steerable_share against the L1 arm before attributing any
# rFID difference to the norm itself.
#
# Reference (L1): w1graded 9.600, w2graded 9.941, control ftnoaug 9.117.
# lr 4.5e-6, matching the runs those numbers came from.

model:
  base_learning_rate: 4.5e-6            # matches the L1 runs (9.600 / 9.941)
  target: ldm_ftmse.autoencoder_steerable.AutoencoderKLSteerableEMA
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_steerable_mse.LPIPSWithDiscriminatorSteerableMSE
      params:
        disc_start: 400                 # = the 20k arms' 200: venv_ldm2 is Lightning 1.9.5, which counts
                                        # BOTH optimizers in global_step. 400 -> GAN on at ~1 epoch. Safe only because the
        kl_weight: 0.000001             # discriminator is pretrained (kl-f8, step 246803)
        disc_weight: 0.5
        disc_skip_recon_loss: True      # BIT-EXACT speed flag
        rec_loss_type: mse              # upstream is l1; pixel_weight stays 1.0
        perceptual_weight: 0.1          # VGG LPIPS 1.0 -> 0.1 (sd-vae-ft-mse's published MSE + 0.1*LPIPS)
        # --- steerable distillation, the only new term ---------------------------
        # steerable_normalize: nll_units multiplies the mean-reduced rel-L1 by
        # 3*256*256 = 196608, putting it in the same per-image-sum units as nll_loss.
        # Without it, weight 0.5 against a total of ~29,000 is ~1e-6 of the objective
        # and the run would be indistinguishable from the control.
        steerable_weight: 1.0
        steerable_normalize: nll_units
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        steerable_band_weights:         # graded diffweight ramp, level 0 = FINEST
          "('residual_highpass',)": 0.10
          "('band', 0, 0)": 0.12
          "('band', 0, 1)": 0.12
          "('band', 0, 2)": 0.12
          "('band', 0, 3)": 0.12
          "('band', 1, 0)": 0.18
          "('band', 1, 1)": 0.18
          "('band', 1, 2)": 0.18
          "('band', 1, 3)": 0.18
          "('band', 2, 0)": 0.27
          "('band', 2, 1)": 0.27
          "('band', 2, 2)": 0.27
          "('band', 2, 3)": 0.27
          "('band', 3, 0)": 0.60
          "('band', 3, 1)": 0.60
          "('band', 3, 2)": 0.60
          "('band', 3, 3)": 0.60
          "('band', 4, 0)": 1.50
          "('band', 4, 1)": 1.50
          "('band', 4, 2)": 1.50
          "('band', 4, 3)": 1.50
          "('residual_lowpass',)": 0.05

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 48                      # 2 x H200 x accum 1 -> global 96, identical to the 4 x A40 @12 arms
    num_workers: 12
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
        latents_file: ${oc.env:LDM_DATA}/latent_cache/subset_20k_rcrop_ftmse_train.npy   # BIT-EXACT; skips the frozen encoder
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
        latents_file: ${oc.env:LDM_DATA}/latent_cache/subset_20k_rcrop_ftmse_val.npy

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

    # Epoch-pinned checkpoints, every 5 epochs plus the true final epoch.
    # Own directory, no monitor, no top-k -- save_top_k cannot prune these, and
    # unlike last.ckpt they are written at epoch boundaries, so a mid-epoch kill
    # cannot truncate them. Added after w1graded_mse lost all 9 of its epochs to
    # a corrupt last.ckpt when SIGUSR1 landed mid-write on 2026-09-06.
    periodic_ckpt:
      target: ldm_ftmse.periodic_checkpoint.PeriodicCheckpoint
      params:
        dirpath: checkpoints_periodic
        every_n_epochs: 5
        save_on_train_end: true
        max_keep: 0
        save_weights_only: false

  trainer:
    benchmark: True
    precision: bf16
    accumulate_grad_batches: 1          # folded into batch_size; global batch unchanged at 96
    max_epochs: 25
