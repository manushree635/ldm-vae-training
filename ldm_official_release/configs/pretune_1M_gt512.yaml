# L1 + LPIPS against GT at 512, and NOTHING else.
#
# pretune_1M with the steerable pyramid replaced by L1 + LPIPS at 512 -- and with BOTH 256 terms
# switched off, so the 512 terms are the whole loss. The 512 target is the ORIGINAL image squashed
# to 512x512, not the teacher VAE's reconstruction of it: the same substitution
# pretune_1M_gt256.yaml makes at 256, via data_squash(teacher_from_source=True), which builds the
# target on the fly from the frame already decoded for the student -- no teacher PNG is read.
#
#   total loss = 1.0*mean|up(S) - GT@512| + 1.0*LPIPS-VGG(GT@512, up(S))     and NOTHING else
#
# CHANGED from pretune_1M:
#   loss target        -> ldm_ftmse.losses_teacher512.LPIPSWithDiscriminatorTeacher512
#   steerable_weight   1.0 -> 0.0        (the steerable_band_weights block below is inert at 0)
#   pixelloss_weight   1.0 -> 0.0        no L1 at 256
#   perceptual_weight  1.0 -> 0.0        no LPIPS at 256
#   teacher_dir        teacher_recons_512_png -> split_0, + teacher_from_source: True
#                                        (train AND validation blocks)
#   + teacher512_l1_weight / teacher512_perceptual_weight
#
# The 256 branch collapses EXACTLY, not approximately: rec_loss = pixel_weight*|diff| = 0, and
# logvar is not in the optimiser (autoencoder_nogan.py trains decoder + post_quant_conv only), so
# it stays at its init 0.0 and nll = 0/exp(0) + 0 = 0. kl_weight is already 0 and disc_factor 0.
# Verified on CPU: total == t512_l1 + t512_lpips to 1e-6, decoder gradient finite and non-zero.
#
# TWO TRAPS if you edit this. (1) pixelloss_weight is honoured only by
# ldm_ftmse/losses_steerable.py:435 -- upstream contperceptual.py:48 never multiplies by it, so
# setting it to 0 is a silent no-op under upstream's own loss class. (2) perceptual_weight: 0 does
# NOT disarm the 512 LPIPS: self.perceptual_loss is built unconditionally (contperceptual.py:17)
# and the 512 term uses it, so perceptual_net must stay set.
#
# MONITORING: val/rec_loss is identically 0.0 here, so the ModelCheckpoint monitor and any
# val_rec_loss column carry no signal. Read train/t512_l1, train/t512_lpips and aeloss instead;
# save_top_k is -1, so every epoch is kept regardless.
#
# WHAT TO EXPECT. The student is supervised ONLY at 512, through the fixed bicubic 256->512
# upsample, against a target it cannot reach: a 4x32x32 latent decoded to 256 cannot carry GT's
# fine detail, and unlike a teacher recon the GT does not omit it either, so both terms keep an
# irreducible floor. With L1 that floor biases the output toward the conditional MEDIAN, i.e.
# deliberately smooth, and there is no 256 anchor to hold it. Expect blur before detail; watch
# train/t512_l1 against pretune_1M_t512.yaml's trajectory. Measured on the val set, GT and teacher
# recon differ by only ~2-4/255 mean, so this is a small change in the target and a large change
# in what the target MEANS.

model:
  base_learning_rate: 1.0e-5            # nerc training_config.learning_rate (unscaled)
  target: ldm_ftmse.autoencoder_nogan.AutoencoderKLSteerableEMANoGAN
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True                       # eval-only extra: nerc has no EMA -> compare RAW
    adam_weight_decay: 0.0                # 0 to match the GAN twins (nmgA/nmgB had wd removed); nerc used 1e-5
    grad_clip_norm: 0.0                   # 0 to match the GAN twins (no clipping); nerc used 1.0
                                        # gradient_clip_val: PL 1.4.2 + fp16 clips scaled grads)
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_teacher512.LPIPSWithDiscriminatorTeacher512
      params:
        disc_start: 200                 # irrelevant: disc_factor 0 below
        kl_weight: 0.0                  # nerc use_kl_loss: false
        disc_factor: 0.0                # NO GAN (the model class enforces this)
        # --- nerc-style reconstruction: 1 x MSE + 0.1 x LPIPS, MEAN-reduced -------
        pixel_loss: l1                  # L1, upstream's pixel term
        pixelloss_weight: 0.0            # OFF -- no L1 at 256
        perceptual_weight: 0.0           # OFF -- no LPIPS at 256 (its VGG forward is skipped)
        perceptual_net: vgg
        nll_reduction: mean             # mean over C*H*W, not upstream's per-image sum
        # --- steerable distillation, the only new term ---------------------------
        # nll is MEAN-reduced here, so rel-L1 (itself a mean ratio) is already in the
        # same per-element units: no nll_units rescale, exactly as distillation_nerc.
        steerable_weight: 0.0           # OFF: the pyramid is never built (was 1.0)
        # --- 512 terms, replacing the pyramid (losses_teacher512.py) -------------
        teacher512_l1_weight: 1.0       # mean|up(S) - T| at 512, same units as the 256 L1
        teacher512_perceptual_weight: 1.0  # LPIPS(T, up(S)) at 512, same VGG net as 256
        steerable_normalize: none       # REQUIRED with nll_reduction: mean (else raises)
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        # no band schedule: all 22 bands active from epoch 0 (graded weights below)
        steerable_band_weights:         # graded diffweight ramp, level 0 = FINEST
          "('residual_highpass',)": 0.10
          "('band', 0, 0)": 0.12
          "('band', 0, 1)": 0.12
          "('band', 0, 2)": 0.12
          "('band', 0, 3)": 0.12
          "('band', 1, 0)": 0.18
          "('band', 1, 1)": 0.18
          "('band', 1, 2)": 0.18
          "('band', 1, 3)": 0.18
          "('band', 2, 0)": 0.27
          "('band', 2, 1)": 0.27
          "('band', 2, 2)": 0.27
          "('band', 2, 3)": 0.27
          "('band', 3, 0)": 0.60
          "('band', 3, 1)": 0.60
          "('band', 3, 2)": 0.60
          "('band', 3, 3)": 0.60
          "('band', 4, 0)": 1.50
          "('band', 4, 1)": 1.50
          "('band', 4, 2)": 1.50
          "('band', 4, 3)": 1.50
          "('residual_lowpass',)": 0.05

    ddconfig:                           # upstream kl-f8 architecture, untouched
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 48
    num_workers: 8                      # 8 x 2 ranks exactly fills -pe omp 16
    wrap: True
    train:
      target: ldm_ftmse.data_squash.FileListSquashTeacherTrain
      params:                           # NO CROP: one anisotropic Resize((256,256))
        size: 256                       # of the full frame, matching the Resize((512,512))
        degradation: pil_nearest        # the teachers were built with. degradation is inert.
        images_list_file: ${oc.env:LDM_ROOT}/filelists/split_0_1M/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/split_0   # the SOURCE images (unused for reading; must exist)
        teacher_from_source: True       # target = GT: source squashed to 512, NOT a teacher recon
        teacher_size: 512
        latents_file: ${oc.env:LDM_DATA}/latent_cache/split_0_1M_ftmse_train.npy
    validation:
      target: ldm_ftmse.data_squash.FileListSquashTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/split_0_1M/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/split_0   # the SOURCE images (unused for reading; must exist)
        teacher_from_source: True       # target = GT: source squashed to 512, NOT a teacher recon
        teacher_size: 512
        latents_file: ${oc.env:LDM_DATA}/latent_cache/split_0_1M_ftmse_val.npy

lightning:
  modelcheckpoint:
    params:
      save_top_k: -1                    # keep EVERY epoch; val/rec_loss is a bad selector
      every_n_train_steps: 5160         # = one epoch of optimiser steps -> each save is a
                                        # full-epoch resume point (check is_last_batch)

  logger:
    target: pytorch_lightning.loggers.WandbLogger
    params:
      name: ldm_nmn_gt512_1M_h200
      project: vae-knowledge-distillation
      group: ldm_1M
      tags: ["ldm", "1M", "split_0", "no-gan", "nerc-match", "l1", "lpips1.0-vgg", "str0", "gt512", "gt-target", "no-256-terms", "h200", "bf16"]

  callbacks:
    cuda_callback:                      # logs perf/epoch_time_s + peak memory
      target: ldm_ftmse.wandb_logging.CUDACallbackLogged

    image_logger:
      target: ldm_ftmse.wandb_logging.ImageLoggerWandb
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    precision: bf16
    accumulate_grad_batches: 2
    max_epochs: 25
