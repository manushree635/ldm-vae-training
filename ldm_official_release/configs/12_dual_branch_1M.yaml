# DUAL-BRANCH DECODER at 1M scale. Not yet run -- see "UNTESTED" below.
#
# MODEL block = experiments/..._nercmatch_l1vgg1_str025_noL0hp_dual_replace_20k.yaml, verbatim:
#   the decoder's last full-resolution block (all of up[0]) is duplicated into a second output
#   tail and the two are combined by a fixed steerable-band split (ldm_ftmse/band_split.py):
#
#       out = LP(b1) + HP(b2)      LP = pyramid levels >= 3 + residual_lowpass
#
#   mode "replace": branch 1 is a full-image tail trained with L1 1.0 + VGG-LPIPS 1.0 vs GT;
#   branch 2 is trained ONLY by the steerable term (weight 0.25, graded), with levels >= 3
#   zeroed by the mode and residual_highpass + level 0 zeroed here ("noL0hp"), i.e. on levels
#   1-2 only. No GAN, single optimiser. Both tails start as copies of sd-vae-ft-mse's and
#   mix() is b2 + LP(b1 - b2), so step 0 is EXACTLY the ft-mse decoder.
#
#   WHY THIS VARIANT: it is the best of the six dual-branch arms at 20k (ep10 COCO rFID 16.7,
#   LPIPS ~control), but still +5 rFID over the single-head control (11.6). Every dual arm lost
#   to its control at 20k; branch 1 alone always matched it, so the damage is branch 2 painting
#   misplaced texture under a phase-blind magnitude metric. This config asks whether 1M images
#   fix that. The other variants are one-line changes:
#     dual_branch_mode: split                       -> L1+LPIPS on LP(b1), steerable on the output
#     restore 0.10 / 0.12 on residual_highpass, L0  -> the plain "replace" arm
#     target: ...AutoencoderKLDualBranchEMA + disc_factor 1.0 -> the GAN twin
#       (see experiments/..._str025_gan_dual_replace_20k.yaml for the full loss block)
#
# DATA / TRAINER block = experiments/..._nercmatch_l1vgg1_str1_1M_h200.yaml, verbatim, so the
#   single-head control for this run is THAT config (no-GAN, L1 + VGG-LPIPS 1.0, graded) --
#   note it runs steerable 1.0 with all bands, so it is a near control, not an exact one:
#   split_0_1M squash teacher set + fp32 latent cache (encoder frozen, crop deterministic),
#   bf16, benchmark True, 48 x 2 accum x 2 GPUs = 192 global, 25 epochs,
#   every_n_train_steps 5160 = one epoch of optimiser steps -> each save is a full-epoch
#   resume point.
#
# UNTESTED at this batch size. The dual tail adds 3 ResBlocks at 256x256 (+~25% decoder
#   FLOPs and activations): at 20k it peaked 43.8 of 46 GiB on an A40 at batch 12 in fp16.
#   The 1M GAN arms peak ~93 GB at batch 48 on an H200 (141 GB); this arm has no
#   discriminator but a wider tail, so 48 should fit on an H200 and will NOT fit on an
#   80 GB A100. If it OOMs, keep the global batch and halve the micro-batch:
#       EXTRA="data.params.batch_size=24 lightning.trainer.accumulate_grad_batches=4 \
#              lightning.modelcheckpoint.params.every_n_train_steps=5160"
#   (5160 is unchanged: optimiser steps per epoch depend on the global batch only).
#   Smoke it first:  qsub -v CONFIG=configs/12_dual_branch_1M.yaml,BATCH=48 scripts/smoke_test.sh
#
# EVAL: a dual checkpoint has no single-tail diffusers form, and the stock loader would drop
#   branch 2. Score it from the LDM checkpoint with the training YAML (eval_recon.py refuses a
#   dual checkpoint without --config rather than silently scoring branch 1):
#       python scripts/eval_recon.py --config configs/12_dual_branch_1M.yaml --use_ema \
#           --ckpt logs/<run>/checkpoints/last.ckpt --filelist filelists/split_0_1M/val.txt
#   For diffusers tooling use scripts/export_dual_branch_to_diffusers.py (writes <dir>/branch1 +
#   dual_branch.pt, loaded by ldm_ftmse/dual_branch_diffusers.py), NOT export_ldm_vae_to_diffusers.py.

model:
  base_learning_rate: 1.0e-5            # nerc training_config.learning_rate (unscaled)
  target: ldm_ftmse.autoencoder_dualbranch.AutoencoderKLDualBranchEMANoGAN
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    adam_weight_decay: 0.0                # 0 to match the GAN twins (nmgA/nmgB had wd removed); nerc used 1e-5
    grad_clip_norm: 0.0                   # 0 to match the GAN twins (no clipping); nerc used 1.0
                                        # gradient_clip_val: PL 1.4.2 + fp16 clips scaled grads)
    teacher_key: teacher
    # --- dual-branch decoder (ldm_ftmse/autoencoder_dualbranch.py) -----------
    dual_branch_mode: replace          # "replace" | "split" -- see the header
    dual_branch_split_level: 3          # fine = residual_highpass + levels 0,1,2 (of the 512 pyramid)
    dual_branch_blocks: 3               # duplicate ALL of up[0] (num_res_blocks + 1) into branch 2
    dual_branch_pad: 32                 # reflect pad before the split's FFT, so the wrap misses the edges
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_dualbranch.LPIPSDualBranchSteerable
      params:
        disc_start: 200                 # irrelevant: disc_factor 0 below
        kl_weight: 0.0                  # nerc use_kl_loss: false
        disc_factor: 0.0                # NO GAN (the model class enforces this)
        # --- nerc-style reconstruction: 1 x MSE + 0.1 x LPIPS, MEAN-reduced -------
        pixel_loss: l1                  # L1, upstream's pixel term
        pixelloss_weight: 1.0
        perceptual_weight: 1.0
        perceptual_net: vgg
        nll_reduction: mean             # mean over C*H*W, not upstream's per-image sum
        # --- steerable distillation, the only new term ---------------------------
        # nll is MEAN-reduced here, so rel-L1 (itself a mean ratio) is already in the
        # same per-element units: no nll_units rescale, exactly as distillation_nerc.
        steerable_weight: 0.25
        steerable_normalize: none       # REQUIRED with nll_reduction: mean (else raises)
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        # no band schedule: all 22 bands active from epoch 0 (graded weights below)
        steerable_band_weights:         # graded diffweight ramp, level 0 = FINEST
          "('residual_highpass',)": 0.0
          "('band', 0, 0)": 0.0
          "('band', 0, 1)": 0.0
          "('band', 0, 2)": 0.0
          "('band', 0, 3)": 0.0
          "('band', 1, 0)": 0.18
          "('band', 1, 1)": 0.18
          "('band', 1, 2)": 0.18
          "('band', 1, 3)": 0.18
          "('band', 2, 0)": 0.27
          "('band', 2, 1)": 0.27
          "('band', 2, 2)": 0.27
          "('band', 2, 3)": 0.27
          "('band', 3, 0)": 0.60
          "('band', 3, 1)": 0.60
          "('band', 3, 2)": 0.60
          "('band', 3, 3)": 0.60
          "('band', 4, 0)": 1.50
          "('band', 4, 1)": 1.50
          "('band', 4, 2)": 1.50
          "('band', 4, 3)": 1.50
          "('residual_lowpass',)": 0.05

    ddconfig:                           # upstream kl-f8 architecture, untouched
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 48
    num_workers: 8                      # 8 x 2 ranks exactly fills -pe omp 16
    wrap: True
    train:
      target: ldm_ftmse.data_squash.FileListSquashTeacherTrain
      params:                           # NO CROP: one anisotropic Resize((256,256))
        size: 256                       # of the full frame, matching the Resize((512,512))
        degradation: pil_nearest        # the teachers were built with. degradation is inert.
        images_list_file: ${oc.env:LDM_ROOT}/filelists/split_0_1M/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/teacher_recons_512_png
        teacher_size: 512
        latents_file: ${oc.env:LDM_DATA}/latent_cache/split_0_1M_ftmse_train.npy
    validation:
      target: ldm_ftmse.data_squash.FileListSquashTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/split_0_1M/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/teacher_recons_512_png
        teacher_size: 512
        latents_file: ${oc.env:LDM_DATA}/latent_cache/split_0_1M_ftmse_val.npy

lightning:
  modelcheckpoint:
    params:
      save_top_k: -1                    # keep EVERY epoch; val/rec_loss is a bad selector
      every_n_train_steps: 5160         # = one epoch of optimiser steps -> each save is a
                                        # full-epoch resume point (check is_last_batch)

  logger:
    target: pytorch_lightning.loggers.WandbLogger
    params:
      name: ldm_dualrep_l1vgg1_str025_noL0hp_1M_h200
      project: vae-knowledge-distillation
      group: ldm_1M
      tags: ["ldm", "1M", "split_0", "no-gan", "nerc-match", "l1", "lpips1.0-vgg", "str0.25", "graded", "dual-branch", "replace", "noL0hp", "h200", "bf16"]

  callbacks:
    cuda_callback:                      # logs perf/epoch_time_s + peak memory
      target: ldm_ftmse.wandb_logging.CUDACallbackLogged

    image_logger:
      target: ldm_ftmse.wandb_logging.ImageLoggerWandb
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    precision: bf16
    accumulate_grad_batches: 2
    max_epochs: 25
