# emagan on sd-vae-ft-mse, no augmentation, NO steerable term, LPIPS trunk = ALEXNET.
#
# One-line diff from ..._ftmse_noaug_20k.yaml: the lossconfig target. Everything
# else is byte-identical -- same init, same AutoencoderKLDecoderOnlyEMA, same
# disc_start 200 / disc_weight 0.5 / kl_weight 1e-6, same fixed-crop
# FileListSRTrain data. So the pair isolates the perceptual backbone alone.
#
# WHY: upstream LDM hardcodes VGG16 LPIPS (contperceptual.py:17, no switch), and
# every arm in this study has inherited it unquestioned. Zhang et al. 2018 report
# AlexNet as the best-performing LPIPS backbone on their 2AFC human-judgement
# benchmark despite being the smallest, and it is the default in the reference
# implementation -- VGG is what LDM happened to inherit, not what was measured to
# be better. LPIPS is also the term this project already found to be load-bearing
# (lowering lpips_weight to the MSE crossover blew rFID to 19.4), so which trunk
# computes it is not a cosmetic choice.
#
# ldm_ftmse.lpips_alex.LPIPSAlex mirrors taming's LPIPS exactly and swaps only the
# trunk (chns [64,128,256,512,512] -> [64,192,384,256,256], vgg16.features slices
# -> alexnet.features 0:2,2:5,5:8,8:10,10:12). Verified BIT-IDENTICAL to
# richzhang/PerceptualSimilarity's lpips.LPIPS(net='alex'): max abs diff 0.0 on a
# 4x3x256x256 probe. Trunk params 2.47M vs VGG16 LPIPS's ~14.7M.
#
# READ THE RESULT WITH THIS CAVEAT: the two trunks return different magnitudes
# for the same input pair, so holding perceptual_weight at 1.0 across the swap
# also shifts the effective perceptual:l1 balance. A difference in rFID confounds
# "alex is a better perceptual metric" with "alex is a differently-scaled one".
# Comparing the logged p_loss magnitudes between this run and ftnoaug is the way
# to tell how much of any gap is just scale.

model:
  base_learning_rate: 4.5e-6            # upstream LDM's value. NOTE: the model
                                      # cards do NOT publish a learning rate.
  target: ldm_ftmse.autoencoder.AutoencoderKLDecoderOnlyEMA
  params:
    monitor: "val/rec_loss"
    embed_dim: 4
    use_ema: True
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_alexlpips.LPIPSAlexWithDiscriminator  # VGG16 -> AlexNet trunk
      params:                           # upstream values; perceptual_weight
        disc_start: 200        # ~1 epoch; safe only because the
                               # discriminator is pretrained (kl-f8, step 246803)
        kl_weight: 0.000001
        disc_weight: 0.5

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]  # num_down = len(ch_mult)-1
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12                      # upstream
    num_workers: 4                      # upstream leaves this unset, which
    wrap: True                          # defaults to batch_size*2 = 24 per rank
    train:                              # (96 workers on 16 cores). Operational.
      target: ldm_ftmse.data.FileListSRTrain
      params:
        size: 256                       # upstream
        degradation: pil_nearest        # upstream
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        min_crop_f: 1.0                  # augmentation OFF -- identical to
        max_crop_f: 1.0                  # what data_teacher forces
        random_crop: False
    validation:
      target: ldm_ftmse.data.FileListSRValidation
      params:
        size: 256                       # upstream
        degradation: pil_nearest        # upstream
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        min_crop_f: 1.0                  # augmentation OFF -- identical to
        max_crop_f: 1.0                  # what data_teacher forces
        random_crop: False

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    accumulate_grad_batches: 2          # upstream
    max_epochs: 25                      # the plain run showed everything happens
                                        # early; 25 is ample to see the effect
