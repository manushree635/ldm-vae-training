# sd-vae-ft-mse + steerable w=2.0, GRADED band weights, FINE-TO-COARSE schedule.
#
# Weights are distillation_nerc's diffweight ramp, 0.12 -> 1.50 toward COARSE
# (NOT reversed): band_0 finest at 0.12 up to band_4 coarsest at 1.50, with
# residual_highpass 0.10 and residual_lowpass 0.05.
#
# Schedule activates one scale level at a time, finest first:
#   epoch 0 -> 1 level, 5 -> 2, 10 -> 3, 15 -> 4, 20 -> 5.  ramp_epochs 2.
# The aggregation in steerable_rel_l1 is a weighted MEAN, sum(w*rel)/sum(w), so
# zeroing a level renormalises the rest automatically -- the term does not shrink
# just because fewer levels are on. normalize_by_active_levels stays false: it is
# applied to the WEIGHTS here, where a uniform factor cancels in that mean, so it
# is a verified no-op (rel_l1 bit-identical with it on or off).
#
# KNOWN CONCERN, recorded not silently fixed: fine_to_coarse activates the FINEST
# level first, and on this 512-pyramid / 256-student pairing level 0 is
# residual_highpass + band_0_*, which sit ABOVE the student's Nyquist. Measured
# across six arms residual_highpass is pinned near 0.95 and barely moves under any
# weighting. So epochs 0-19 train largely on frequencies the decoder cannot
# produce, and band_4 -- 55.9% of the total weight mass -- only switches on at
# epoch 20 of 25. Its static twin is ..._w2graded_20k.yaml.

model:
  base_learning_rate: 4.5e-6            # upstream LDM's value; the model cards publish none
  target: ldm_ftmse.autoencoder_steerable.AutoencoderKLSteerableEMA
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_steerable.LPIPSWithDiscriminatorSteerable
      params:
        disc_start: 200                 # ~1 epoch; safe only because the
        kl_weight: 0.000001             # discriminator is pretrained (kl-f8, step 246803)
        disc_weight: 0.5
        # --- steerable distillation, the only new term ---------------------------
        # steerable_normalize: nll_units multiplies the mean-reduced rel-L1 by
        # 3*256*256 = 196608, putting it in the same per-image-sum units as nll_loss.
        # Without it, weight 0.5 against a total of ~29,000 is ~1e-6 of the objective
        # and the run would be indistinguishable from the control.
        steerable_weight: 2.0
        steerable_normalize: nll_units
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        # --- fine-to-coarse progressive schedule -------------------------
        steerable_band_schedule_order: fine_to_coarse
        steerable_band_ramp_epochs: 2
        steerable_normalize_by_active_levels: false
        steerable_band_schedule:
          - {epoch: 0,  active_levels: 1}   # residual_highpass + band_0_* only
          - {epoch: 5,  active_levels: 2}
          - {epoch: 10, active_levels: 3}
          - {epoch: 15, active_levels: 4}
          - {epoch: 20, active_levels: 5}   # + band_4_* (w=1.50) + residual_lowpass
        steerable_band_weights:         # graded diffweight ramp, level 0 = FINEST
          "('residual_highpass',)": 0.10
          "('band', 0, 0)": 0.12
          "('band', 0, 1)": 0.12
          "('band', 0, 2)": 0.12
          "('band', 0, 3)": 0.12
          "('band', 1, 0)": 0.18
          "('band', 1, 1)": 0.18
          "('band', 1, 2)": 0.18
          "('band', 1, 3)": 0.18
          "('band', 2, 0)": 0.27
          "('band', 2, 1)": 0.27
          "('band', 2, 2)": 0.27
          "('band', 2, 3)": 0.27
          "('band', 3, 0)": 0.60
          "('band', 3, 1)": 0.60
          "('band', 3, 2)": 0.60
          "('band', 3, 3)": 0.60
          "('band', 4, 0)": 1.50
          "('band', 4, 1)": 1.50
          "('band', 4, 2)": 1.50
          "('band', 4, 3)": 1.50
          "('residual_lowpass',)": 0.05

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12
    num_workers: 6                      # +2 over baseline: an extra 512 PNG decode per item
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    accumulate_grad_batches: 2
    max_epochs: 25
