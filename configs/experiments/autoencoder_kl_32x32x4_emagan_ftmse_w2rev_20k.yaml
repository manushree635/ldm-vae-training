# sd-vae-ft-mse + steerable w=2.0, ORIENTED BANDS REVERSED, residuals unchanged.
#
# The five oriented-band weights are reversed so the FINEST oriented band carries
# the largest weight; residual_highpass and residual_lowpass keep their original
# values:
#
#   band                f (512 grid)   forward   this run
#   residual_highpass    0.25-0.50       0.10       0.10   (unchanged)
#   band_0               0.25-0.50       0.12  ->   1.50
#   band_1               0.125-0.25      0.18  ->   0.60
#   band_2               0.06-0.125      0.27       0.27
#   band_3               0.03-0.06       0.60  ->   0.18
#   band_4               0.016-0.03      1.50  ->   0.12
#   residual_lowpass        <0.016       0.05       0.05   (unchanged)
#
# Why leaving the residuals alone matters. residual_highpass is the one band the
# 256 student genuinely cannot produce -- 2.6% of the teacher's energy reaches it
# and its rel_L1 RISES during training (0.957 -> 0.977), the signature of an
# objective pushing at something unattainable. Weighting it heaviest (the full
# reversal) would put 42.8% of the term there. Holding it at 0.10 keeps that to
# 2.1%.
#
# band_0 is a different case and is where this run concentrates: 105% of the
# teacher's energy is reachable there and its rel_L1 FALLS in 3 of 4 orientations,
# so the decoder is learning it. This asks what happens when the term pushes hard
# on the finest band it can actually act on.
#
# PREDICTED, from the measured per-band rel_L1:
#   rel_L1                      0.128 -> 0.4285
#   steerable_share at w=2.0             0.858
#   share on residual_highpass            2.1%   (vs 42.8% for a full reversal)
#   share on band_0                      70.1%
#
# So ~70% of the objective lands on one learnable band an octave above where the
# GAN operates. Compare against the forward ramp at w=0.5 (9.363) and the equal
# w=5 run (12.957, which degraded after epoch 4).

model:
  base_learning_rate: 4.5e-6            # upstream LDM's value; the model cards publish none
  target: ldm_ftmse.autoencoder_steerable.AutoencoderKLSteerableEMA
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_steerable.LPIPSWithDiscriminatorSteerable
      params:
        disc_start: 200                 # ~1 epoch; safe only because the
        kl_weight: 0.000001             # discriminator is pretrained (kl-f8, step 246803)
        disc_weight: 0.5
        # --- steerable distillation, the only new term ---------------------------
        # steerable_normalize: nll_units multiplies the mean-reduced rel-L1 by
        # 3*256*256 = 196608, putting it in the same per-image-sum units as nll_loss.
        # Without it, weight 0.5 against a total of ~29,000 is ~1e-6 of the objective
        # and the run would be indistinguishable from the control.
        steerable_weight: 2.0   # steerable term at the same weight as the SD-1.5 arms
        steerable_normalize: nll_units
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        steerable_band_weights:         # oriented bands reversed; residuals unchanged
          "('residual_highpass',)": 0.1
          "('band', 0, 0)": 1.5
          "('band', 0, 1)": 1.5
          "('band', 0, 2)": 1.5
          "('band', 0, 3)": 1.5
          "('band', 1, 0)": 0.6
          "('band', 1, 1)": 0.6
          "('band', 1, 2)": 0.6
          "('band', 1, 3)": 0.6
          "('band', 2, 0)": 0.27
          "('band', 2, 1)": 0.27
          "('band', 2, 2)": 0.27
          "('band', 2, 3)": 0.27
          "('band', 3, 0)": 0.18
          "('band', 3, 1)": 0.18
          "('band', 3, 2)": 0.18
          "('band', 3, 3)": 0.18
          "('band', 4, 0)": 0.12
          "('band', 4, 1)": 0.12
          "('band', 4, 2)": 0.12
          "('band', 4, 3)": 0.12
          "('residual_lowpass',)": 0.05

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12
    num_workers: 6                      # +2 over baseline: an extra 512 PNG decode per item
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    accumulate_grad_batches: 2
    max_epochs: 25
