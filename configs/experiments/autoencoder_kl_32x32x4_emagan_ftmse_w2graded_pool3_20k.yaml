# 20k faces: w2graded (autoencoder_kl_32x32x4_emagan_ftmse_w2graded_20k.yaml) with ONE
# change -- the steerable term compares 3x3 box-pooled band MAGNITUDES (local energy)
# instead of pointwise magnitudes. Everything else is w2graded's: sd-vae-ft-mse init,
# L1 + LPIPS + pretrained discriminator, steerable weight 2.0 graded diffweight bands,
# nll_units, 512 upsample match, teacher target, lr 4.5e-6, global batch 96, 25 epochs.
# Logging only differs: wandb + periodic checkpoints (every 5 + final).

model:
  base_learning_rate: 4.5e-6            # upstream LDM's value; the model cards publish none
  target: ldm_ftmse.autoencoder_steerable.AutoencoderKLSteerableEMA
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_steerable.LPIPSWithDiscriminatorSteerable
      params:
        disc_start: 200                 # ~1 epoch; safe only because the
        kl_weight: 0.000001             # discriminator is pretrained (kl-f8, step 246803)
        disc_weight: 0.5
        # --- steerable distillation, the only new term ---------------------------
        # steerable_normalize: nll_units multiplies the mean-reduced rel-L1 by
        # 3*256*256 = 196608, putting it in the same per-image-sum units as nll_loss.
        # Without it, weight 0.5 against a total of ~29,000 is ~1e-6 of the objective
        # and the run would be indistinguishable from the control.
        steerable_weight: 2.0
        steerable_normalize: nll_units
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        # --- the ONLY change from w2graded: pooled-magnitude comparison ---------
        # per oriented band: r_k = mean|pool3|a_t| - pool3|a_s|| / (mean|a_t| + eps),
        # pool3 = F.avg_pool2d(., 3, stride=1, padding=1). Residual bands unchanged.
        steerable_mag_pool: true        # ON/OFF switch; false = plain w2graded
        steerable_mag_pool_kernel: 3
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        steerable_band_weights:         # graded diffweight ramp, level 0 = FINEST
          "('residual_highpass',)": 0.10
          "('band', 0, 0)": 0.12
          "('band', 0, 1)": 0.12
          "('band', 0, 2)": 0.12
          "('band', 0, 3)": 0.12
          "('band', 1, 0)": 0.18
          "('band', 1, 1)": 0.18
          "('band', 1, 2)": 0.18
          "('band', 1, 3)": 0.18
          "('band', 2, 0)": 0.27
          "('band', 2, 1)": 0.27
          "('band', 2, 2)": 0.27
          "('band', 2, 3)": 0.27
          "('band', 3, 0)": 0.60
          "('band', 3, 1)": 0.60
          "('band', 3, 2)": 0.60
          "('band', 3, 3)": 0.60
          "('band', 4, 0)": 1.50
          "('band', 4, 1)": 1.50
          "('band', 4, 2)": 1.50
          "('band', 4, 3)": 1.50
          "('residual_lowpass',)": 0.05

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12
    num_workers: 6                      # +2 over baseline: an extra 512 PNG decode per item
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512


lightning:
  logger:
    target: pytorch_lightning.loggers.WandbLogger
    params:
      name: ldm_emagan_ftmse_w2graded_pool3_20k
      project: vae-knowledge-distillation
      group: ldm_20k_gan
      tags: ["ldm", "20k", "gan", "steerable", "w2", "graded", "magpool3"]

  callbacks:
    image_logger:
      target: ldm_ftmse.wandb_logging.ImageLoggerWandb
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

    fixed_image:
      target: ldm_ftmse.wandb_logging.FixedImageReconLogger
      params:
        image_path: ${oc.env:LDM_ROOT}/assets/fixed_recon_image.jpg
        every_n_steps: 200
        size: 256
        log_key: gown

    cuda_callback:
      target: ldm_ftmse.wandb_logging.CUDACallbackLogged

    periodic_ckpt:
      target: ldm_ftmse.periodic_checkpoint.PeriodicCheckpoint
      params:
        dirpath: checkpoints_periodic
        every_n_epochs: 5
        save_on_train_end: true
        max_keep: 0
        save_weights_only: false

  trainer:
    benchmark: True
    accumulate_grad_batches: 4          # 12 x 2 GPUs x 4 = 96 (w2graded: 12 x 4 x 2)
    max_epochs: 25
