# H200 copy of ..._ftmse_w1graded_nogan_20k.yaml (user: "try to get it on the h200s"). Loss/optimiser unchanged;
# stack changed exactly as the w1eq stack control (..._w1eq_20k_h200stackctrl.yaml): bf16, torch 2.4 / Lightning 1.9.5,
# batch 48 x accum 1 (global 96 unchanged), latent cache, periodic ckpts. CAVEAT: the stack alone cost w1eq ~0.5 rFID
# (10.57 -> 11.09), so vs the OLD-stack w1graded (9.60) this mixes GAN-off with the stack change.
#
# w1graded with the GAN OFF -- ..._emagan_ftmse_w1graded_20k.yaml (job 7435929, 4xA40, PL 1.4.2, 25 ep,
# rFID 9.60 at ep24) with ONLY the adversarial term removed: no-GAN model class (critic frozen, one
# optimiser) + disc_factor 0. Adam betas kept at the GAN class's (0.5, 0.9) and no weight decay / clipping,
# so the optimiser is identical and the GAN is the only difference.
#
# sd-vae-ft-mse + steerable w=1.0, GRADED band weights, NO schedule.
#
# Static twin of ..._w1f2c_20k.yaml (weight 1.0, same graded diffweight bands,
# fine_to_coarse schedule) -- this run has every band live from epoch 0 instead
# of activated one scale level at a time. Isolates the SCHEDULE at w=1.0, same
# comparison as w2graded/w2f2c but at half the weight.
#
# Weights are distillation_nerc's diffweight ramp, 0.12 -> 1.50 toward COARSE
# (NOT reversed): band_0 finest at 0.12 up to band_4 coarsest at 1.50, with
# residual_highpass 0.10 and residual_lowpass 0.05.

model:
  base_learning_rate: 4.5e-6          # = what w1graded ACTUALLY ran at (job 7435929 log + saved project config);
                                      # its yaml was later changed to 1e-5 -- do not copy that
  target: ldm_ftmse.autoencoder_nogan.AutoencoderKLSteerableEMANoGAN
  params:
    adam_betas: [0.5, 0.9]              # = AutoencoderKLSteerableEMA's opt_ae betas (upstream autoencoder.py:207)
    adam_weight_decay: 0.0
    grad_clip_norm: 0.0
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_steerable.LPIPSWithDiscriminatorSteerable
      params:
        disc_start: 200                 # ~1 epoch; safe only because the
        kl_weight: 0.000001             # discriminator is pretrained (kl-f8, step 246803)
        disc_weight: 0.5
        disc_factor: 0.0                # GAN OFF (the no-GAN class refuses anything else)
        # --- steerable distillation, the only new term ---------------------------
        # steerable_normalize: nll_units multiplies the mean-reduced rel-L1 by
        # 3*256*256 = 196608, putting it in the same per-image-sum units as nll_loss.
        # Without it, weight 0.5 against a total of ~29,000 is ~1e-6 of the objective
        # and the run would be indistinguishable from the control.
        steerable_weight: 1.0
        steerable_normalize: nll_units
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        steerable_band_weights:         # graded diffweight ramp, level 0 = FINEST
          "('residual_highpass',)": 0.10
          "('band', 0, 0)": 0.12
          "('band', 0, 1)": 0.12
          "('band', 0, 2)": 0.12
          "('band', 0, 3)": 0.12
          "('band', 1, 0)": 0.18
          "('band', 1, 1)": 0.18
          "('band', 1, 2)": 0.18
          "('band', 1, 3)": 0.18
          "('band', 2, 0)": 0.27
          "('band', 2, 1)": 0.27
          "('band', 2, 2)": 0.27
          "('band', 2, 3)": 0.27
          "('band', 3, 0)": 0.60
          "('band', 3, 1)": 0.60
          "('band', 3, 2)": 0.60
          "('band', 3, 3)": 0.60
          "('band', 4, 0)": 1.50
          "('band', 4, 1)": 1.50
          "('band', 4, 2)": 1.50
          "('band', 4, 3)": 1.50
          "('residual_lowpass',)": 0.05

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 48                      # 2 x H200 x accum 1 -> global 96, same as the 4 x A40 @12 original
    num_workers: 12
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
        latents_file: ${oc.env:LDM_DATA}/latent_cache/subset_20k_rcrop_ftmse_train.npy   # BIT-EXACT; skips the frozen encoder
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
        latents_file: ${oc.env:LDM_DATA}/latent_cache/subset_20k_rcrop_ftmse_val.npy

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

    periodic_ckpt:
      target: ldm_ftmse.periodic_checkpoint.PeriodicCheckpoint
      params:
        dirpath: checkpoints_periodic
        epochs: []
        every_n_epochs: 5
        max_keep: 0
        save_weights_only: false
        save_on_train_end: true

  trainer:
    benchmark: True
    precision: bf16
    accumulate_grad_batches: 1          # folded into batch_size; global batch unchanged at 96
    max_epochs: 25
