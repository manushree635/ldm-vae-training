# sd-vae-ft-mse + steerable w=10.0, EQUAL band weights, DOWNSAMPLE match (h=4).
#
# The match_mode twin of ..._w10eq_20k.yaml. Same init, same weight, same equal
# weights -- only the comparison resolution differs, so the pair isolates
# match_mode and nothing else.
#
#   upsample   (w10eq)  student 256 -> 512, pyramid at 512, 22 bands
#   downsample (this)   teacher 512 -> 256, pyramid at 256, 18 bands
#
# WHY. In upsample mode residual_highpass and band_0_* sit ABOVE the 256 student's
# Nyquist -- content the decoder physically cannot produce. Measured across six
# arms residual_highpass is pinned near 0.95 and barely moves under any weighting,
# and under equal weights it plus band_0 take ~50% of the gradient allocation.
# w10eq is the worst arm in the study (rFID 15.102) and that is the suspected
# reason. Downsampling drops those two band groups by construction: 18 keys, no
# ('band', 4, *), and band_0's rel_L1 falls 0.977 -> 0.683 because at 256 it is
# a reachable band rather than an imaginary one.
#
# So this run asks: is w=10 catastrophic because the weight is too high, or
# because half of it was spent on unreachable frequencies? Existing evidence
# splits the difference -- w5dn (downsample, w=5) scored 12.466 vs w5eq
# (upsample, w=5) 12.950, a real but small gain. If unreachability were the whole
# story the gap should widen sharply at w=10.

model:
  base_learning_rate: 4.5e-6            # upstream LDM's value; the model cards publish none
  target: ldm_ftmse.autoencoder_steerable.AutoencoderKLSteerableEMA
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_steerable.LPIPSWithDiscriminatorSteerable
      params:
        disc_start: 200                 # ~1 epoch; safe only because the
        kl_weight: 0.000001             # discriminator is pretrained (kl-f8, step 246803)
        disc_weight: 0.5
        # --- steerable distillation, the only new term ---------------------------
        # steerable_normalize: nll_units multiplies the mean-reduced rel-L1 by
        # 3*256*256 = 196608, putting it in the same per-image-sum units as nll_loss.
        # Without it, weight 0.5 against a total of ~29,000 is ~1e-6 of the objective
        # and the run would be indistinguishable from the control.
        steerable_weight: 10.0  # matches w10eq (upsample) so the pair isolates match_mode
        steerable_normalize: nll_units
        steerable_height: 4             # comparison at 256 -> SCFpyr height 6 -> 18 bands @256
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: downsample  # teacher 512 -> 256; drops the 2 above-Nyquist bands
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        steerable_band_weights:         # EQUAL -- 18 bands, height 4 (256 grid)
          "('residual_highpass',)": 1.0
          "('band', 0, 0)": 1.0
          "('band', 0, 1)": 1.0
          "('band', 0, 2)": 1.0
          "('band', 0, 3)": 1.0
          "('band', 1, 0)": 1.0
          "('band', 1, 1)": 1.0
          "('band', 1, 2)": 1.0
          "('band', 1, 3)": 1.0
          "('band', 2, 0)": 1.0
          "('band', 2, 1)": 1.0
          "('band', 2, 2)": 1.0
          "('band', 2, 3)": 1.0
          "('band', 3, 0)": 1.0
          "('band', 3, 1)": 1.0
          "('band', 3, 2)": 1.0
          "('band', 3, 3)": 1.0
          "('residual_lowpass',)": 1.0

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12
    num_workers: 6                      # +2 over baseline: an extra 512 PNG decode per item
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    accumulate_grad_batches: 2
    max_epochs: 25
