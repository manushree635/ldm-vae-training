# BAND-BALANCED MSE vs TEACHER 512 at 512 GEOMETRY (256 recon upsampled to 512) -- DECODER ONLY (encoder frozen, latent cache ON -- bit-exact).
# = autoencoder_kl_32x32x4_emagan_ftmse_w1eq_20k_h200stackctrl.yaml (H200 w1eq control) with: the steerable
# term DROPPED, ldm_ftmse.losses_bandbal.LPIPSWithDiscriminatorBandBal adding the gate probe's band-balanced MSE
# (weight 1.0, nll_units), batch 24 x 2 GPU x accum 2 (= 96, same global batch and disc timing).
# L1 + LPIPS + GAN stay vs the GT 256 image. One of 4 arms: {gt, teacher} x {decoder-only, encoder+decoder}.
model:
  base_learning_rate: 4.5e-6            # upstream LDM's value; the model cards publish none
  target: ldm_ftmse.autoencoder_steerable.AutoencoderKLSteerableEMA
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_bandbal.LPIPSWithDiscriminatorBandBal
      params:
        disc_start: 400                 # = 200 under PL 1.4.2: venv_ldm2 is Lightning 1.9.5 and counts
                                        # BOTH optimizers in global_step. Safe only because the
        kl_weight: 0.000001             # discriminator is pretrained (kl-f8, step 246803)
        disc_weight: 0.5
        disc_skip_recon_loss: True      # BIT-EXACT speed flag
        # --- band-balanced MSE (losses_bandbal.py): the gate probe's loss. steerable term OFF. ---
        steerable_weight: 0.0           # strpy dropped (user, 2026-09-18)
        bandbal_weight: 1.0             # nll_units; ~0.25 x 196608 ~ 49k/img at init, a share like w1eq's steerable
        bandbal_target: teacher               # the 512 teacher recon
        bandbal_geometry: 512                 # 256 recon UPSAMPLED to 512 (the steerable term's bicubic _up), vs teacher 512
        bandbal_levels: [lo, L4, L3, L2, L1, L0]   # hi (182-362 cpi) dropped: wholly above the 256 student's Nyquist,
                                              # so its term is unreachable and only asks for invented energy
        bandbal_normalize: nll_units
        bandbal_energies: null          # measured on the first 16 batches of the target, DDP-averaged, frozen

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 24                      # x 2 GPU x accum 2 -> global 96, as the control; 24/GPU fits RTX PRO 6000 and H200
    num_workers: 12
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
        latents_file: ${oc.env:LDM_DATA}/latent_cache/subset_20k_rcrop_ftmse_train.npy   # BIT-EXACT; skips the frozen encoder
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
        latents_file: ${oc.env:LDM_DATA}/latent_cache/subset_20k_rcrop_ftmse_val.npy

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True
    periodic_ckpt:
      target: ldm_ftmse.periodic_checkpoint.PeriodicCheckpoint
      params:
        dirpath: checkpoints_periodic
        epochs: []
        every_n_epochs: 5
        max_keep: 0
        save_weights_only: false
        save_on_train_end: true

  trainer:
    benchmark: True
    precision: bf16
    accumulate_grad_batches: 2          # 24 x 2 GPU x 2 = 96; global_step/epoch unchanged, so disc_start 400 still = ~1 epoch
    max_epochs: 25
