# emagan recipe on sd-vae-ft-mse init, augmentation DISABLED, no steerable term.
#
# The ft-mse sibling of ..._noaug_20k.yaml (SD-1.5 init) -- identical in every
# other respect: same class (AutoencoderKLDecoderOnlyEMA), same unmodified
# upstream LPIPSWithDiscriminator, same explicit min_crop_f=max_crop_f=1.0 /
# random_crop=False on the plain (non-teacher) FileListSRTrain pipeline.
#
# This is a deliberately different code path from mctrl, which reaches
# steerable_weight=0.0 through the STEERABLE-capable class and data_teacher
# (which forces the same no-augmentation crop, but also loads and discards a
# 512px teacher PNG every batch it never uses). Comparing this run to mctrl
# checks whether that unused teacher-loading path changes anything; comparing
# it to the SD-1.5 noaug run isolates init alone, with augmentation and the
# steerable term both held at zero on both sides.

model:
  base_learning_rate: 4.5e-6            # upstream LDM's value. NOTE: the model
                                      # cards do NOT publish a learning rate.
  target: ldm_ftmse.autoencoder.AutoencoderKLDecoderOnlyEMA
  params:
    monitor: "val/rec_loss"
    embed_dim: 4
    use_ema: True
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator   # upstream, unmodified
      params:                           # upstream values; perceptual_weight
        disc_start: 200        # ~1 epoch; safe only because the
                               # discriminator is pretrained (kl-f8, step 246803)
        kl_weight: 0.000001
        disc_weight: 0.5

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]  # num_down = len(ch_mult)-1
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12                      # upstream
    num_workers: 4                      # upstream leaves this unset, which
    wrap: True                          # defaults to batch_size*2 = 24 per rank
    train:                              # (96 workers on 16 cores). Operational.
      target: ldm_ftmse.data.FileListSRTrain
      params:
        size: 256                       # upstream
        degradation: pil_nearest        # upstream
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        min_crop_f: 1.0                  # augmentation OFF -- identical to
        max_crop_f: 1.0                  # what data_teacher forces
        random_crop: False
    validation:
      target: ldm_ftmse.data.FileListSRValidation
      params:
        size: 256                       # upstream
        degradation: pil_nearest        # upstream
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        min_crop_f: 1.0                  # augmentation OFF -- identical to
        max_crop_f: 1.0                  # what data_teacher forces
        random_crop: False

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    accumulate_grad_batches: 2          # upstream
    max_epochs: 25                      # the plain run showed everything happens
                                        # early; 25 is ample to see the effect
