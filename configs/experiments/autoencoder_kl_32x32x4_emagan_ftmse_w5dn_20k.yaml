# sd-vae-ft-mse + steerable w=5.0, EQUAL bands, DOWNSAMPLE match, height 4.
#
# The three previous equal-band runs all compared at 512 with the student
# bicubic-upsampled (match_mode: upsample). That put ~50% of the term on
# residual_highpass + band_0, which sit ABOVE the 256 student's Nyquist -- the
# student can only satisfy them by manufacturing near-Nyquist energy, which is
# visible as a lattice over the gown's embroidery in the w=10 reconstructions.
#
# This run removes that failure mode by construction: match_mode "downsample"
# resizes the TEACHER to 256 and compares on the student's native grid, so every
# band is representable. height 4 because a 256 pyramid caps there (18 bands:
# highpass + 4 levels x 4 orientations + lowpass); height 5 would raise on the
# four unconsumed ('band', 4, *) keys.
#
# Measured on 6 real val pairs, equal weights:
#   upsample  h=5:  rel_L1 = 0.284   (residual_highpass 0.977, band_0 ~0.54)
#   downsample h=4: rel_L1 = 0.121   (residual_highpass 0.683, band_0 ~0.23)
# so the same scalar buys less share here. Predicted steerable_share at w=5.0
# is 0.809 (vs 0.900 for the upsample equivalent, which scored 12.957).
#
# NOTE what changes about the TARGET: downsampling the teacher to 256 discards
# its 512 detail, so this distils "the teacher's content at 256" rather than
# "the teacher's 512 content seen through an upsampler". That is a different
# objective, not just a different comparison grid.
#
# residual_highpass still takes ~31% of an equal allocation at 0.683 -- it is the
# top octave of the 256 grid and remains the hardest band. Watch whether its
# rel_L1 falls (learnable) or rises (stuck), as it rose in every upsample run.

model:
  base_learning_rate: 4.5e-6            # upstream LDM's value; the model cards publish none
  target: ldm_ftmse.autoencoder_steerable.AutoencoderKLSteerableEMA
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_steerable.LPIPSWithDiscriminatorSteerable
      params:
        disc_start: 200                 # ~1 epoch; safe only because the
        kl_weight: 0.000001             # discriminator is pretrained (kl-f8, step 246803)
        disc_weight: 0.5
        # --- steerable distillation, the only new term ---------------------------
        # steerable_normalize: nll_units multiplies the mean-reduced rel-L1 by
        # 3*256*256 = 196608, putting it in the same per-image-sum units as nll_loss.
        # Without it, weight 0.5 against a total of ~29,000 is ~1e-6 of the objective
        # and the run would be indistinguishable from the control.
        steerable_weight: 5.0   # steerable term at the same weight as the SD-1.5 arms
        steerable_normalize: nll_units
        steerable_height: 4             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: downsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        steerable_band_weights:         # EQUAL -- 18 bands, height 4 (256 grid)
          "('residual_highpass',)": 1.0
          "('band', 0, 0)": 1.0
          "('band', 0, 1)": 1.0
          "('band', 0, 2)": 1.0
          "('band', 0, 3)": 1.0
          "('band', 1, 0)": 1.0
          "('band', 1, 1)": 1.0
          "('band', 1, 2)": 1.0
          "('band', 1, 3)": 1.0
          "('band', 2, 0)": 1.0
          "('band', 2, 1)": 1.0
          "('band', 2, 2)": 1.0
          "('band', 2, 3)": 1.0
          "('band', 3, 0)": 1.0
          "('band', 3, 1)": 1.0
          "('band', 3, 2)": 1.0
          "('band', 3, 3)": 1.0
          "('residual_lowpass',)": 1.0

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12
    num_workers: 6                      # +2 over baseline: an extra 512 PNG decode per item
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    accumulate_grad_batches: 2
    max_epochs: 25
