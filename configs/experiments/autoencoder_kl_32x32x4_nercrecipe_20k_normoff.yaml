# 20k faces, distillation_nerc's RECIPE inside the upstream LDM harness.
#
#   1.0 x MSE + 0.1 x LPIPS + 0.5 x steerable        MEAN-reduced, NO GAN
#   Adam with torch's DEFAULT betas (0.9, 0.999), lr 1e-5
#   steerable: graded diffweight bands, fine_to_coarse schedule
#   normalize_by_active_levels: OFF
#
# Purpose: every recipe difference between ldm_official and distillation_nerc is
# switched to nerc's value here EXCEPT the harness, so this pair asks whether the
# codebase itself matters. Unchanged from the ldm_official family: sd-vae-ft-mse
# init, decoder-only (encoder + quant_conv frozen), EMA, 20k rcrop teacher data,
# 22 bands at 512 via upsample match, teacher-recon target.
#
# Pieces, all opt-in so every earlier arm is untouched:
#   * AutoencoderKLSteerableEMANoGAN -- ONE optimiser, default Adam betas, the
#     critic frozen and never run (disc_factor 0.0 is enforced).
#   * losses_steerable nll_reduction: mean -- nll divided by C*H*W too. Forces
#     steerable_normalize: none; nll_units with a mean nll would make the term
#     ~99.999% of the objective, so that combination now raises.
#   * steerable_normalize_by_active_levels now has nerc's semantics: the TERM is
#     multiplied by 1/active_levels (nerc lightning_module.py:2023-2036). It used
#     to scale the band WEIGHTS, where the factor cancels in sum(w*rel)/sum(w) --
#     a verified no-op, which is why every earlier config left it false.
#
# With normalization OFF, the steerable term's multiplier over the schedule is:
#   epochs 0-4: 1   5-9: 1   10-14: 1   15-19: 1   20-24: 1
#
# Logged to wandb project vae-knowledge-distillation, group ldm_20k_nerc_recipe,
# with a pinned-image panel (the red gown, data_test_100/Second-Phase17674.jpg).

model:
  base_learning_rate: 1.0e-5            # used directly: launcher passes --scale_lr False
  target: ldm_ftmse.autoencoder_nogan.AutoencoderKLSteerableEMANoGAN
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_steerable.LPIPSWithDiscriminatorSteerable
      params:
        disc_start: 200                 # irrelevant: disc_factor 0 below
        kl_weight: 0.000001             # inert -- encoder frozen, KL has no grad path
        disc_factor: 0.0                # NO GAN (the model class enforces this)
        # --- nerc-style reconstruction: 1 x MSE + 0.1 x LPIPS, MEAN-reduced -------
        pixel_loss: l2                  # MSE, not upstream's L1
        pixelloss_weight: 1.0
        perceptual_weight: 0.1          # sd-vae-ft-mse's published MSE + 0.1 LPIPS
        nll_reduction: mean             # mean over C*H*W, not upstream's per-image sum
        # --- steerable distillation, the only new term ---------------------------
        # nll is MEAN-reduced here, so rel-L1 (itself a mean ratio) is already in the
        # same per-element units: no nll_units rescale, exactly as distillation_nerc.
        steerable_weight: 0.5
        steerable_normalize: none       # REQUIRED with nll_reduction: mean (else raises)
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        # --- fine-to-coarse progressive schedule -------------------------
        steerable_band_schedule_order: fine_to_coarse
        steerable_band_ramp_epochs: 2
        steerable_normalize_by_active_levels: false
        steerable_band_schedule:
          - {epoch: 0,  active_levels: 1}   # residual_highpass + band_0_* only
          - {epoch: 5,  active_levels: 2}
          - {epoch: 10, active_levels: 3}
          - {epoch: 15, active_levels: 4}
          - {epoch: 20, active_levels: 5}   # + band_4_* (w=1.50) + residual_lowpass
        steerable_band_weights:         # graded diffweight ramp, level 0 = FINEST
          "('residual_highpass',)": 0.10
          "('band', 0, 0)": 0.12
          "('band', 0, 1)": 0.12
          "('band', 0, 2)": 0.12
          "('band', 0, 3)": 0.12
          "('band', 1, 0)": 0.18
          "('band', 1, 1)": 0.18
          "('band', 1, 2)": 0.18
          "('band', 1, 3)": 0.18
          "('band', 2, 0)": 0.27
          "('band', 2, 1)": 0.27
          "('band', 2, 2)": 0.27
          "('band', 2, 3)": 0.27
          "('band', 3, 0)": 0.60
          "('band', 3, 1)": 0.60
          "('band', 3, 2)": 0.60
          "('band', 3, 3)": 0.60
          "('band', 4, 0)": 1.50
          "('band', 4, 1)": 1.50
          "('band', 4, 2)": 1.50
          "('band', 4, 3)": 1.50
          "('residual_lowpass',)": 0.05

    ddconfig:                           # upstream kl-f8 architecture, untouched
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12
    num_workers: 6                      # +2 over baseline: an extra 512 PNG decode per item
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512


lightning:
  logger:
    target: pytorch_lightning.loggers.WandbLogger
    params:
      # main.py merges this over its default logger config, whose `name` is a
      # literal string -- so name it here or every run is called that.
      name: ldm_nercrecipe_20k_normoff
      project: vae-knowledge-distillation
      group: ldm_20k_nerc_recipe
      tags: ["ldm", "20k", "no-gan", "mse", "lpips0.1", "mean", "str0.5",
             "graded", "fine_to_coarse", "normalize-off"]

  callbacks:
    image_logger:                       # recon grids -> wandb (upstream has no wandb handler)
      target: ldm_ftmse.wandb_logging.ImageLoggerWandb
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

    fixed_image:                        # one pinned face, same image every time
      target: ldm_ftmse.wandb_logging.FixedImageReconLogger
      params:
        image_path: ${oc.env:LDM_ROOT}/assets/fixed_recon_image.jpg
        every_n_steps: 200
        size: 256
        log_key: gown

    cuda_callback:                      # perf/epoch_time_s + peak memory
      target: ldm_ftmse.wandb_logging.CUDACallbackLogged

    periodic_ckpt:                      # every 5 epochs + final, safe from save_top_k
      target: ldm_ftmse.periodic_checkpoint.PeriodicCheckpoint
      params:
        dirpath: checkpoints_periodic
        every_n_epochs: 5
        save_on_train_end: true
        max_keep: 0
        save_weights_only: false

  trainer:
    benchmark: True
    accumulate_grad_batches: 4          # 12 x 2 GPUs x 4 = global batch 96, as every 20k arm
    max_epochs: 25
