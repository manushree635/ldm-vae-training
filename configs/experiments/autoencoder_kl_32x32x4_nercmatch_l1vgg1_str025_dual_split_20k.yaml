# STEERABLE WEIGHT 0.25 (2026-09-16). Identical to
# autoencoder_kl_32x32x4_nercmatch_l1vgg1_str05_dual_split_20k.yaml
# except steerable_weight 0.5 -> 0.25 and the wandb name/tags. The str 0.5 pair scored COCO
# rFID 31.3 (replace) / 38.0 (split) vs 11.7 for the single-head control.
#
# DUAL-BRANCH DECODER, mode "split". nmnB (..._nercmatch_l1vgg1_str05_20k.yaml) with the
# decoder's last full-resolution block duplicated into a second output tail. The two tails are
# combined by a fixed steerable-band split (ldm_ftmse/band_split.py):
#
#     out = LP(b1) + HP(b2)      LP = pyramid levels >= 3 + residual_lowpass
#
# so branch 2 owns residual_highpass + levels 0,1,2 -- the octaves above ~23 cycles/image of the
# 256 output, which is above the 32x32 latent's Nyquist and includes the 16-64 cpi identity bands.
# Both tails start as copies of sd-vae-ft-mse's, and mix() is b2 + LP(b1 - b2), so step 0 is
# EXACTLY the ft-mse decoder.
#
# ROUTING ("split"): b1 is trained as the LOW-PASS image (L1 + VGG-LPIPS on LP(b1) vs LP(GT));
# the steerable term is on the COMBINED output with all 22 bands, as in nmnB. val/rec_loss is
# therefore a low-passed number and is NOT comparable across arms -- read dual_final_l1.
#
# Everything else -- losses, weights, data, batch, precision, schedule -- is nmnB's, unchanged, so
# nmnB is the direct control. Cost: 3 extra ResBlocks at 256x256 (+~25% decoder FLOPs).
# No existing file was modified for this arm; the new classes subclass the ones nmnB runs.
#
# nerc-match, NO GAN: L1 1.0 + VGG-LPIPS 1.0 + steerable 0.5. The no-GAN twin of
# ..._nercmatch_gan_l1vgg1_str05_20k.yaml (nmgB, rFID 9.08 with the GAN). Differs from ..._nercmatch_20k.yaml ONLY in
# pixel_loss / perceptual_net / perceptual_weight / steerable_weight. Single optimiser, so Lightning 1.9's
# per-optimiser global_step counting changes nothing here (no disc_start in play).
#
# distillation_nerc's 20k steerable run, matched as closely as the LDM harness allows,
# minus its fine-to-coarse schedule (per request: all bands at once).
#
#   loss   1.0 x MSE + 0.3 x AlexNet-LPIPS + 0.5 x steerable, MEAN-reduced, no GAN, no KL
#          steerable: height 5, 4 orient., complex magnitude, luminance, 512 upsample,
#          graded diffweight bands, ALL active from epoch 0, teacher-recon target
#   optim  Adam default betas, lr 1e-5, weight decay 1e-5, grad-clip 1.0 (unscaled), no scheduler
#   batch  global 384 (nerc: 24/GPU x 4 GPUs x 4 accum; here 12 x 2 GPUs x 16), fp16, 50 epochs
#   data   nerc's exact split of LAION_FACE/subset_20k (19000/1000, seed 42), squash resize,
#          nerc's teacher recons (subset_20k_teacher_recons_512_png)
#   model  sd-vae-ft-mse init, encoder + quant_conv frozen, decoder + post_quant_conv trained,
#          posterior SAMPLED (both codebases)
#
# Source: distillation_nerc configs/20k/no_dis/
#   config_no_dis_1e5_str_0.5_laion_precomputed_20k_diffweight_phase_fine_to_coarse.json
# Not matched: framework (PL 1.4.2 / torch 1.11 vs Lightning 2 / torch 2.7). EMA is kept as
# an eval-only extra; nerc saves raw weights, so compare the RAW row.

model:
  base_learning_rate: 1.0e-5            # nerc training_config.learning_rate (unscaled)
  target: ldm_ftmse.autoencoder_dualbranch.AutoencoderKLDualBranchEMANoGAN
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True                       # eval-only extra: nerc has no EMA -> compare RAW
    adam_weight_decay: 0.0                # 0 to match the GAN twins (nmgA/nmgB had wd removed); nerc used 1e-5
    grad_clip_norm: 0.0                   # 0 to match the GAN twins (no clipping); nerc used 1.0
                                        # gradient_clip_val: PL 1.4.2 + fp16 clips scaled grads)
    teacher_key: teacher
    # --- dual-branch decoder (ldm_ftmse/autoencoder_dualbranch.py) -----------
    dual_branch_mode: split          # "replace" | "split" -- see the header
    dual_branch_split_level: 3          # fine = residual_highpass + levels 0,1,2 (of the 512 pyramid)
    dual_branch_blocks: 3               # duplicate ALL of up[0] (num_res_blocks + 1) into branch 2
    dual_branch_pad: 32                 # reflect pad before the split's FFT, so the wrap misses the edges
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_dualbranch.LPIPSDualBranchSteerable
      params:
        disc_start: 200                 # irrelevant: disc_factor 0 below
        kl_weight: 0.0                  # nerc use_kl_loss: false
        disc_factor: 0.0                # NO GAN (the model class enforces this)
        # --- nerc-style reconstruction: 1 x MSE + 0.1 x LPIPS, MEAN-reduced -------
        pixel_loss: l1                  # L1, upstream's pixel term
        pixelloss_weight: 1.0
        perceptual_weight: 1.0
        perceptual_net: vgg
        nll_reduction: mean             # mean over C*H*W, not upstream's per-image sum
        # --- steerable distillation, the only new term ---------------------------
        # nll is MEAN-reduced here, so rel-L1 (itself a mean ratio) is already in the
        # same per-element units: no nll_units rescale, exactly as distillation_nerc.
        steerable_weight: 0.25
        steerable_normalize: none       # REQUIRED with nll_reduction: mean (else raises)
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        # no band schedule: all 22 bands active from epoch 0 (graded weights below)
        steerable_band_weights:         # graded diffweight ramp, level 0 = FINEST
          "('residual_highpass',)": 0.10
          "('band', 0, 0)": 0.12
          "('band', 0, 1)": 0.12
          "('band', 0, 2)": 0.12
          "('band', 0, 3)": 0.12
          "('band', 1, 0)": 0.18
          "('band', 1, 1)": 0.18
          "('band', 1, 2)": 0.18
          "('band', 1, 3)": 0.18
          "('band', 2, 0)": 0.27
          "('band', 2, 1)": 0.27
          "('band', 2, 2)": 0.27
          "('band', 2, 3)": 0.27
          "('band', 3, 0)": 0.60
          "('band', 3, 1)": 0.60
          "('band', 3, 2)": 0.60
          "('band', 3, 3)": 0.60
          "('band', 4, 0)": 1.50
          "('band', 4, 1)": 1.50
          "('band', 4, 2)": 1.50
          "('band', 4, 3)": 1.50
          "('residual_lowpass',)": 0.05

    ddconfig:                           # upstream kl-f8 architecture, untouched
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12                      # nerc uses 24/GPU; 24 OOMs here even in fp16 (40.3/44.4 GiB,
                                        # smoke 7519709) -> 12 x 16 accum x 2 GPUs = the same 384
    num_workers: 8                      # nerc training_config.num_workers
    wrap: True
    train:
      target: ldm_ftmse.data_nerc.NercTeacherTrain
      params:
        images_list_file: ${oc.env:LDM_ROOT}/filelists/nerc_subset_20k/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_teacher_recons_512_png
        size: 256
        teacher_size: 512
    validation:
      target: ldm_ftmse.data_nerc.NercTeacherValidation
      params:
        images_list_file: ${oc.env:LDM_ROOT}/filelists/nerc_subset_20k/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_teacher_recons_512_png
        size: 256
        teacher_size: 512

lightning:
  logger:
    target: pytorch_lightning.loggers.WandbLogger
    params:
      name: ldm_dualspl_l1vgg1_str025_20k
      project: vae-knowledge-distillation
      group: ldm_20k_nerc_recipe
      tags: ["ldm", "20k", "no-gan", "nerc-match", "l1", "lpips1.0-vgg", "str0.25", "graded", "fp16", "dual-branch", "split"]

  callbacks:
    image_logger:
      target: ldm_ftmse.wandb_logging.ImageLoggerWandb
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

    fixed_image:
      target: ldm_ftmse.wandb_logging.FixedImageReconLogger
      params:
        image_path: ${oc.env:LDM_ROOT}/assets/fixed_recon_image.jpg
        every_n_steps: 200
        size: 256
        log_key: gown

    cuda_callback:
      target: ldm_ftmse.wandb_logging.CUDACallbackLogged

    periodic_ckpt:
      target: ldm_ftmse.periodic_checkpoint.PeriodicCheckpoint
      params:
        dirpath: checkpoints_periodic
        every_n_epochs: 5
        save_on_train_end: true
        max_keep: 0
        save_weights_only: false

  trainer:
    benchmark: False                    # nerc: cudnn.benchmark = False
    precision: 16                       # nerc device_config.mixed_precision -> "16-mixed" (fp16 AMP)
    accumulate_grad_batches: 16         # 12 x 2 GPUs x 16 = 384 = nerc's 24 x 4 GPUs x 4. Every loss
                                        # term is a per-image mean and the decoder has no BatchNorm, so
                                        # accumulation gives the same update as the bigger micro-batch.
    max_epochs: 25                      # 25 per request 2026-09-15 (nerc: 50)
