# sd-vae-ft-mse + steerable w=1.0 GRADED, with a LEARNED SUB-PIXEL (PixelShuffle)
# UPSAMPLER in place of bicubic on the student's 256 -> 512 path. No consistency loop.
#
# Twin of ..._w1graded_20k.yaml (the arm that scored 9.600) with ONE change:
# steerable_upsampler: subpixel.
#
# WHAT CHANGES. Every upsample run so far lifted the 256 student to the 512 teacher
# grid with a fixed bicubic F.interpolate. Bicubic puts no energy above the 256
# grid's Nyquist, so residual_highpass and band_0 at 512 could only be matched by
# the decoder manufacturing near-Nyquist lattice energy (see ..._w5dn_20k.yaml).
# Here the up path is ldm_ftmse/subpixel_up.py: one 5x5 kernel per output phase,
# shared across channels, replicate-padded, interleaved by PixelShuffle(2). Linear,
# 100 parameters, LOSS-SIDE ONLY (the deployed decoder still emits 256). It is
# initialised to reproduce bicubic to fp32 rounding, so step 0 of this run IS the
# w1graded arm; from there the head trains in opt_ae with the decoder.
#
# WHAT TO WATCH, against ..._w1graded_20k.yaml:
#   train/steer_up_head_drift        max |weight - bicubic init|. 0 at step 0. If it
#                                    stays ~0 the 100-param head is not moving at the
#                                    decoder lr -> raise steerable_upsampler_lr_mult.
#   train/steer_band_residual_highpass, train/steer_band_band_0_*
#                                    the above-Nyquist bands. Pinned in every bicubic
#                                    run; the head is the only thing that can move them
#                                    without the decoder faking lattice energy.
#   train/steerable_rel_l1, train/steerable_share
#                                    must start at the w1graded arm's first-step values.
#   rFID / val LPIPS                 the head could in principle "absorb" the term
#                                    (learn a sharper kernel so the decoder needs to
#                                    do less). It is linear and DC-normalised, so its
#                                    capacity for that is small, but check the decoder
#                                    still improves, not just the loss.
#
# KNOBS (defaults shown; see losses_steerable.py module docstring, UPSAMPLER):
#   steerable_upsampler_normalize_dc: True   taps sum to 1 per phase -> no gain/offset cheat
#   steerable_upsampler_lr_mult: 1.0         head lr = base_learning_rate * this

model:
  base_learning_rate: 1e-5            # upstream LDM's value; the model cards publish none
  target: ldm_ftmse.autoencoder_steerable.AutoencoderKLSteerableEMA
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_steerable.LPIPSWithDiscriminatorSteerable
      params:
        disc_start: 200                 # ~1 epoch; safe only because the
        kl_weight: 0.000001             # discriminator is pretrained (kl-f8, step 246803)
        disc_weight: 0.5
        # --- steerable distillation, the only new term ---------------------------
        # steerable_normalize: nll_units multiplies the mean-reduced rel-L1 by
        # 3*256*256 = 196608, putting it in the same per-image-sum units as nll_loss.
        # Without it, weight 0.5 against a total of ~29,000 is ~1e-6 of the objective
        # and the run would be indistinguishable from the control.
        steerable_weight: 1.0
        steerable_normalize: nll_units
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        # --- student-side upsampler: THE change vs the w1graded arm ----------------
        steerable_upsampler: subpixel   # conv5x5 + PixelShuffle(2), bicubic init, trained
        steerable_upsampler_normalize_dc: True
        steerable_upsampler_lr_mult: 1.0
        steerable_band_weights:         # graded diffweight ramp, level 0 = FINEST
          "('residual_highpass',)": 0.10
          "('band', 0, 0)": 0.12
          "('band', 0, 1)": 0.12
          "('band', 0, 2)": 0.12
          "('band', 0, 3)": 0.12
          "('band', 1, 0)": 0.18
          "('band', 1, 1)": 0.18
          "('band', 1, 2)": 0.18
          "('band', 1, 3)": 0.18
          "('band', 2, 0)": 0.27
          "('band', 2, 1)": 0.27
          "('band', 2, 2)": 0.27
          "('band', 2, 3)": 0.27
          "('band', 3, 0)": 0.60
          "('band', 3, 1)": 0.60
          "('band', 3, 2)": 0.60
          "('band', 3, 3)": 0.60
          "('band', 4, 0)": 1.50
          "('band', 4, 1)": 1.50
          "('band', 4, 2)": 1.50
          "('band', 4, 3)": 1.50
          "('residual_lowpass',)": 0.05

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12
    num_workers: 6                      # +2 over baseline: an extra 512 PNG decode per item
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    accumulate_grad_batches: 2
    max_epochs: 25
