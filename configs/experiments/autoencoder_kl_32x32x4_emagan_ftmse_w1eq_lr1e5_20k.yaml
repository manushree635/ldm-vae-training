# steerable w=1.0, EQUAL bands, lr=1e-5.  WITH the steerable term.
#
# LEARNING-RATE PAIR at lr = 1.0e-5 (upstream/default is 4.5e-6, so 2.22x).
# The two configs ..._w1eq_lr1e5_20k.yaml and ..._ctrl_lr1e5_20k.yaml differ by
# EXACTLY ONE LINE -- steerable_weight 1.0 vs 0.0 -- so the pair isolates the
# steerable term at the higher rate. Band weights are all 1.0 in both; at
# steerable_weight 0.0 they are inert (losses_steerable returns before touching
# them), and keeping them identical makes the diff a single line.
#
# WHY lr MATTERS HERE. --scale_lr False is passed by the launcher, so
# base_learning_rate IS the optimiser lr, unscaled by batch/GPU count. The
# existing pair at 4.5e-6 is mctrl 9.129 vs w1eq -- i.e. the steerable term
# costs rFID at the default rate. Whether that survives a 2.22x higher rate is
# not obvious: this project has already found LPIPS dominance to be load-bearing
# and to behave like a direction-setter rather than a step-size under Adam, so
# the relative pull of the terms need not be lr-invariant.
#
# Everything else matches the existing ft-mse family: sd-vae-ft-mse init,
# AutoencoderKLSteerableEMA, disc_start 200, disc_weight 0.5, kl_weight 1e-6,
# data_teacher (augmentation forced off), 25 epochs.

model:
  base_learning_rate: 1.0e-5            # 2.22x upstream's 4.5e-6 -- see header
  target: ldm_ftmse.autoencoder_steerable.AutoencoderKLSteerableEMA
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_steerable.LPIPSWithDiscriminatorSteerable
      params:
        disc_start: 200                 # ~1 epoch; safe only because the
        kl_weight: 0.000001             # discriminator is pretrained (kl-f8, step 246803)
        disc_weight: 0.5
        # --- steerable distillation, the only new term ---------------------------
        # steerable_normalize: nll_units multiplies the mean-reduced rel-L1 by
        # 3*256*256 = 196608, putting it in the same per-image-sum units as nll_loss.
        # Without it, weight 0.5 against a total of ~29,000 is ~1e-6 of the objective
        # and the run would be indistinguishable from the control.
        steerable_weight: 1.0   # extends the equal-band ladder below w2eq (2.0), w5eq, w10eq
        steerable_normalize: nll_units
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        steerable_band_weights:         # graded diffweight ramp, level 0 = FINEST
          "('residual_highpass',)": 1.0
          "('band', 0, 0)": 1.0
          "('band', 0, 1)": 1.0
          "('band', 0, 2)": 1.0
          "('band', 0, 3)": 1.0
          "('band', 1, 0)": 1.0
          "('band', 1, 1)": 1.0
          "('band', 1, 2)": 1.0
          "('band', 1, 3)": 1.0
          "('band', 2, 0)": 1.0
          "('band', 2, 1)": 1.0
          "('band', 2, 2)": 1.0
          "('band', 2, 3)": 1.0
          "('band', 3, 0)": 1.0
          "('band', 3, 1)": 1.0
          "('band', 3, 2)": 1.0
          "('band', 3, 3)": 1.0
          "('band', 4, 0)": 1.0
          "('band', 4, 1)": 1.0
          "('band', 4, 2)": 1.0
          "('band', 4, 3)": 1.0
          "('residual_lowpass',)": 1.0

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12
    num_workers: 6                      # +2 over baseline: an extra 512 PNG decode per item
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop_teacher_recons_512_png
        teacher_size: 512

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    accumulate_grad_batches: 2
    max_epochs: 25
