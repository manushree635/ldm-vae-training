# sd-vae-ft-mse + steerable w=1.0, GRADED bands, static -- TARGET = 512 GT, not teacher.
#
# Data-only diff from ..._w1graded_20k.yaml: the steerable term's target changes
# from the precomputed teacher reconstructions to the ORIGINAL 512 images.
#
#   w1graded  teacher_dir = subset_20k_rcrop_teacher_recons_512_png (.png)
#   THIS      teacher_dir = subset_20k_rcrop                        (.jpg)
#
# No code change is needed: data_teacher._teacher_path is
# `teacher_dir / stem + teacher_ext`, the rcrop sources are ALREADY 512x512, and
# all 20,000 filelist entries are .jpg -- so pointing teacher_dir at the source
# directory resolves each "teacher" to the image itself. Verified path-identical.
#
# WHAT THIS CHANGES CONCEPTUALLY. The term stops being DISTILLATION and becomes a
# GT reconstruction loss in the steerable domain. Under w1graded the student is
# asked to match what a 512-resolution VAE actually produced -- an attainable
# target that already passed through an encoder/decoder. Here it is asked to match
# the true 512 image, which contains detail (a) no 4x32x32 latent can carry and
# (b) the teacher itself does not reproduce. residual_highpass and band_0 sit
# above the 256 student's Nyquist either way, but against GT even the mid bands
# now carry an irreducible floor.
#
# PRIOR SIGNAL, worth watching: distillation_nerc found that defaulting the
# steerable term to a GT target (`use_gt_for_image_losses=true`) turned it into a
# GT recon loss and destabilised training. Different codebase and resolution, but
# the same substitution. If rel_L1 plateaus high and refuses to fall, that is why.
#
# lr pinned to 4.5e-6 = what the w1graded run scoring 9.600 actually used, so this
# is a one-variable comparison against it. (The w1graded config on disk was later
# edited to 1e-5 and no longer matches its own recorded result.)

model:
  base_learning_rate: 4.5e-6            # matches the w1graded RUN (9.600)
  target: ldm_ftmse.autoencoder_steerable.AutoencoderKLSteerableEMA
  params:
    monitor: "val/rec_loss"             # NOTE: anti-correlated with rFID on GAN runs.
    embed_dim: 4                        # Select checkpoints by rFID, not by this.
    use_ema: True
    teacher_key: teacher
    ckpt_path: "${oc.env:LDM_ROOT}/models/ftmse_vae_ldm_with_disc.ckpt"
    lossconfig:
      target: ldm_ftmse.losses_steerable.LPIPSWithDiscriminatorSteerable
      params:
        disc_start: 200                 # ~1 epoch; safe only because the
        kl_weight: 0.000001             # discriminator is pretrained (kl-f8, step 246803)
        disc_weight: 0.5
        # --- steerable distillation, the only new term ---------------------------
        # steerable_normalize: nll_units multiplies the mean-reduced rel-L1 by
        # 3*256*256 = 196608, putting it in the same per-image-sum units as nll_loss.
        # Without it, weight 0.5 against a total of ~29,000 is ~1e-6 of the objective
        # and the run would be indistinguishable from the control.
        steerable_weight: 1.0
        steerable_normalize: nll_units
        steerable_height: 5             # +2 residuals -> SCFpyr height 7 -> 22 bands @512
        steerable_order: 3              # nbands = order+1 = 4 orientations
        steerable_match_mode: upsample  # student 256 -> 512; keeps all 22 bands alive
        steerable_color_mode: luminance
        steerable_complex: True
        steerable_complex_metric: magnitude
        steerable_eps: 1.0e-8
        steerable_log_bands: True       # watch residual_highpass / band_0_*: they sit
                                        # above the student's Nyquist and may stay pinned
        steerable_band_weights:         # graded diffweight ramp, level 0 = FINEST
          "('residual_highpass',)": 0.10
          "('band', 0, 0)": 0.12
          "('band', 0, 1)": 0.12
          "('band', 0, 2)": 0.12
          "('band', 0, 3)": 0.12
          "('band', 1, 0)": 0.18
          "('band', 1, 1)": 0.18
          "('band', 1, 2)": 0.18
          "('band', 1, 3)": 0.18
          "('band', 2, 0)": 0.27
          "('band', 2, 1)": 0.27
          "('band', 2, 2)": 0.27
          "('band', 2, 3)": 0.27
          "('band', 3, 0)": 0.60
          "('band', 3, 1)": 0.60
          "('band', 3, 2)": 0.60
          "('band', 3, 3)": 0.60
          "('band', 4, 0)": 1.50
          "('band', 4, 1)": 1.50
          "('band', 4, 2)": 1.50
          "('band', 4, 3)": 1.50
          "('residual_lowpass',)": 0.05

    ddconfig:                           # upstream, untouched -- this is kl-f8
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2,4,4 ]
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12
    num_workers: 6                      # +2 over baseline: an extra 512 PNG decode per item
    wrap: True
    train:
      target: ldm_ftmse.data_teacher.FileListSRTeacherTrain
      params:                           # min_crop_f/max_crop_f/random_crop are forced by
        size: 256                       # the class -- deliberately absent so the YAML
        degradation: pil_nearest        # cannot break alignment
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/train.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop   # GT, not teacher recons
        teacher_ext: .jpg
        teacher_size: 512
    validation:
      target: ldm_ftmse.data_teacher.FileListSRTeacherValidation
      params:
        size: 256
        degradation: pil_nearest
        images_list_file: ${oc.env:LDM_ROOT}/filelists/subset_20k_rcrop/val.txt
        teacher_dir: ${oc.env:LDM_DATA}/subset_20k_rcrop   # GT, not teacher recons
        teacher_ext: .jpg
        teacher_size: 512

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    accumulate_grad_batches: 2
    max_epochs: 25
